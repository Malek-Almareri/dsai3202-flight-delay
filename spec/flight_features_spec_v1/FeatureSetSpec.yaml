$schema: http://azureml/sdk-2-0/FeatureSetSpec.json
# Version 1 = the first list of candidates. It is kept unchanged as a record. Do not train on it:
#   year                   is the same in every row (always 2022)
#   *_delay_rate_all (x3)  are averages over the WHOLE period: they include the flight itself and flights after it
source:
  type: parquet
  path: abfss://curated@amazonlake60303551.dfs.core.windows.net/flights/combined_flights_2022/v1/features_ts/*.parquet
  timestamp_column:
    name: prediction_ts
features:
  - name: carrier
    type: string
  - name: origin
    type: string
  - name: dest
    type: string
  - name: route
    type: string
  - name: dep_hour
    type: long
  - name: arr_hour
    type: long
  - name: day_of_week
    type: long
  - name: month
    type: long
  - name: year
    type: long
  - name: distance
    type: double
  - name: sched_elapsed_min
    type: double
  - name: is_weekend
    type: boolean
  - name: origin_sched_flights_hour
    type: long
  - name: origin_delay_rate_all
    type: double
  - name: carrier_delay_rate_all
    type: double
  - name: route_delay_rate_all
    type: double
index_columns:
  - name: flight_key
    type: string
source_lookback:
  days: 7300
